<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tabletop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--felt:#14352c;--felt2:#0f2a23;--wood:#3b2616;--gold:#e3b95a;--ink:#f3ead7;--w:96px;--h:134px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{touch-action:manipulation;margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--wood);color:var(--ink);font:15px/1.3 Georgia,"Iowan Old Style",serif}
#app{display:grid;grid-template-rows:auto 1fr 142px 168px;height:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--wood);flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:#5a3b22;border:1px solid #7d5733;border-radius:8px;padding:9px 14px;min-height:44px;touch-action:manipulation}
button:active{background:#7d5733}
button.z{min-width:92px;text-align:left}
button.z b{display:block;color:var(--gold);font-size:18px;line-height:1}
.life{display:flex;align-items:center;gap:6px;margin-left:auto}
.life span{font-size:28px;min-width:48px;text-align:center;color:var(--gold)}
.hl{outline:3px solid var(--gold);outline-offset:-3px}
#bf{position:relative;background:radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt2));overflow:hidden;touch-action:none}
#bf .hint{position:absolute;inset:0;display:grid;place-items:center;color:#ffffff40;text-align:center;padding:30px;pointer-events:none}
#hand{display:flex;justify-content:center;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--wood);overflow:hidden;border-top:2px solid #7d5733}
.card{width:var(--w);height:var(--h);border-radius:7px;background:#222;touch-action:none;flex:none;box-shadow:0 2px 6px #0008;overflow:hidden;transition:transform .15s}
.card img{width:100%;height:100%;display:block;object-fit:cover;object-position:left top;pointer-events:none;border-radius:7px}
.card .nm{padding:6px;font-size:12px}
#hand .card{flex:0 1 var(--w);min-width:34px;margin-right:-2px}
#hand .card:last-child{flex:none}
#bf .card{position:absolute}
.card.t{transform:rotate(90deg)}
.card.drag{position:fixed!important;z-index:50;transition:none;box-shadow:0 10px 24px #000a;transform:scale(1.06)}
.ov{position:fixed;inset:0;background:#000c;display:none;z-index:100;place-items:center;padding:20px}
.ov.on{display:grid}
.ov img{max-height:86vh;max-width:92vw;border-radius:16px}
.panel{background:#2a1a0e;border:1px solid #7d5733;border-radius:14px;padding:16px;width:min(640px,100%);max-height:88vh;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:20px;font-weight:400}
textarea{width:100%;height:220px;background:#160d06;color:var(--ink);border:1px solid #7d5733;border-radius:8px;padding:10px;font:14px ui-monospace,Menlo,monospace;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;overflow:auto}
.grid img{width:100%;border-radius:6px}
.grid div{font-size:12px;background:#222;border-radius:6px;padding:6px;aspect-ratio:5/7}
#msg{font-size:13px;color:var(--gold);min-height:18px}
#peek{position:fixed;right:14px;top:84px;width:min(300px,32vw);display:block;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;z-index:40;cursor:pointer}
#peek.on{opacity:1;visibility:visible;transition:opacity .15s}
#peek img{width:100%;display:block;border-radius:14px;box-shadow:0 12px 30px #000c}
#peek .nm{background:#222;border-radius:14px;padding:16px;font-size:18px;aspect-ratio:5/7}
input[type=search]{width:100%;font:16px Georgia,serif;color:var(--ink);background:#160d06;border:1px solid #7d5733;border-radius:8px;padding:11px 12px;min-height:44px;user-select:text;-webkit-user-select:text}
.pt{position:absolute;width:var(--w);display:flex;flex-wrap:wrap;justify-content:center;gap:3px;pointer-events:none;z-index:1}
.pt i{font-style:normal;font-size:12px;white-space:nowrap;background:#000b;color:var(--ink);border:1px solid #7d5733;border-radius:9px;padding:0 7px}
.pt span{display:inline-block;background:#000b;color:var(--gold);border:1px solid #7d5733;border-radius:10px;padding:1px 9px;font-size:15px}
.tk{position:absolute;transform:translateX(-100%);min-height:30px;padding:3px 8px;font-size:12px;border-radius:15px;z-index:2}
.card.tok{outline:2px dashed var(--gold);outline-offset:-2px}
#tokmenu{position:fixed;display:none;z-index:60;flex-direction:column;gap:6px;background:#2a1a0e;border:1px solid #7d5733;border-radius:12px;padding:8px}
#cnr{overflow:auto;display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:10px}
.crow span{flex:1}
.crow b{min-width:30px;text-align:center;font-size:20px;color:var(--gold)}
.crow button{min-width:52px;font-size:20px}
.cb{position:absolute;min-height:30px;min-width:34px;padding:2px 8px;font-size:17px;border-radius:15px;z-index:2}
#tokmenu button{text-align:left;min-width:170px}
#tokmenu button.del{color:#ff9b8a}
.more{position:absolute;transform:translateX(-100%);min-height:30px;min-width:40px;padding:0 10px;font-size:22px;line-height:1;border-radius:15px;z-index:2;opacity:0;pointer-events:none;transition:opacity .5s}
.more.on{opacity:1;pointer-events:auto;transition:opacity .15s}
#bImport{min-width:48px;display:grid;place-items:center}
.pip{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:14px;font-weight:700;color:#111;margin:0 3px 3px 0;box-shadow:inset 0 -2px 3px #0004}
.pW{background:#f3ecc4}.pU{background:#5ab0e8}.pB{background:#9b8aa3}.pR{background:#e8684a}.pG{background:#56b872}.pC{background:#bdb7ae}.pany{background:linear-gradient(135deg,#f3ecc4,#e8684a,#56b872)}
#lands{display:flex;position:relative;touch-action:none;background:linear-gradient(#0d241d,#091a15);border-top:2px solid #7d5733;box-shadow:inset 0 8px 18px #0006}
#manabox{width:132px;flex:none;padding:10px 12px;border-right:1px solid #ffffff14}
#manabox .lbl{font-variant:small-caps;letter-spacing:.08em;color:#cdbb97;font-size:16px}
#mana{margin:2px 0 6px;color:#cdbb97;font-size:13px}
#mana b{font-size:32px;color:var(--gold);margin-right:5px;font-weight:400}
#lcards{position:relative;flex:1;min-width:0}
#lands .card{position:absolute}
.card.sm{width:72px;height:100px}
#bar{background:linear-gradient(#4b3120,#32200f);border-bottom:2px solid #1c1008;box-shadow:0 4px 14px #0006;position:relative;z-index:5}
button{background:linear-gradient(#6a4529,#4e321c);border:1px solid #8c6639;box-shadow:inset 0 1px 0 #ffffff22,0 1px 3px #0005;text-shadow:0 1px 0 #0006}
button:active{background:linear-gradient(#4e321c,#6a4529)}
.life{background:#1f130a;border:1px solid #6b4a2b;border-radius:12px;padding:2px 6px;box-shadow:inset 0 2px 6px #000a}
#bf{background:radial-gradient(ellipse at 50% 35%,#1d4a3c,var(--felt) 45%,#0b1f19);box-shadow:inset 0 0 110px #000a}
#bf .hint{font-style:italic;font-size:17px;color:#ffffff4d}
#hand{background:linear-gradient(#3d2716,#2a1a0e);box-shadow:inset 0 6px 14px #0008}
.card{box-shadow:0 3px 8px #000a,0 0 0 1px #0007}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="bImport" aria-label="Import deck" title="Import deck"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M4 17v3h16v-3"/></svg></button>
    <button class="z" data-zone="lib" id="zLib">Library<b>0</b></button>
    <button id="bDraw">Draw</button>
    <button id="bShuf">Shuffle</button>
    <button id="bUntap">Untap all</button>
    <button class="z" data-zone="gy" id="zGy">Graveyard<b>0</b></button>
    <button class="z" data-zone="ex" id="zEx">Exile<b>0</b></button>
    <button class="z" data-zone="cmd" id="zCmd">Command<b>0</b></button>
    <div class="life"><button id="lm">−</button><span id="life">20</span><button id="lp">+</button></div>
  </div>
  <div id="bf" data-zone="bf"><div class="hint">Load a deck, then drag cards from your hand onto the table. Lands go to the strip below.<br>Double-tap a card to tap it. Tap once to preview, press and hold to zoom.</div></div>
  <div id="lands" data-zone="land"><div id="manabox"><div class="lbl">Lands</div><div id="mana"><b>0</b>mana</div><div id="pips"></div></div><div id="lcards"></div></div>
  <div id="hand" data-zone="hand"></div>
</div>

<div id="peek"></div>
<div class="ov" id="zoom"><img id="zimg" alt=""></div>

<div class="ov" id="imp"><div class="panel">
  <h2>Import a deck</h2>
  <textarea id="list" spellcheck="false">4 Lightning Bolt
4 Goblin Guide
4 Monastery Swiftspear
4 Lava Spike
4 Chain Lightning
4 Rift Bolt
4 Eidolon of the Great Revel
4 Searing Spear
28 Mountain</textarea>
  <div id="msg">Paste a decklist or a Moxfield deck link. Sideboard lines are ignored.</div>
  <div class="row"><button id="go">Load deck</button><button id="restart">Restart game</button><button id="cancel">Close</button></div>
</div></div>

<div class="ov" id="cn"><div class="panel">
  <h2 id="cnt"></h2>
  <div id="cnr"></div>
  <div class="row"><input type="search" id="cni" placeholder="Custom counter name" autocomplete="off" autocapitalize="off"><button id="cna">Add</button></div>
  <div class="row"><button id="cnd">Done</button></div>
</div></div>

<div class="ov" id="zl"><div class="panel">
  <h2 id="zt"></h2>
  <input type="search" id="zs" placeholder="Search by name" autocomplete="off" autocapitalize="off">
  <div class="grid" id="zg"></div>
  <div class="row"><span id="zn" style="flex:1;font-size:13px;color:#cdbb97"></span><button id="zsh">Shuffle &amp; close</button><button id="zc">Close</button></div>
</div></div>

<script>
const $=s=>document.querySelector(s), CW=96, CH=134;
let lastMissing=[];
let S={lib:[],hand:[],bf:[],gy:[],ex:[],cmd:[],land:[],life:20,deck:[]}, uid=0;
const ZN={lib:'Library',hand:'Hand',bf:'Battlefield',gy:'Graveyard',ex:'Exile',cmd:'Command',land:'Lands'};

const ptOf=c=>{const f=c.power!=null?c:(c.card_faces&&c.card_faces[0]);return f&&f.power!=null?f.power+'/'+f.toughness:''};
const tokensOf=c=>{const seen={};return (c.all_parts||[]).filter(p=>p.component==='token'&&!seen[p.name]&&(seen[p.name]=1)).map(p=>({id:p.id,name:p.name}))};
const BASIC={Plains:'W',Island:'U',Swamp:'B',Mountain:'R',Forest:'G'};
const imgOf=c=>{const u=c.image_uris||(c.card_faces&&c.card_faces[0].image_uris);return u?u.normal:''};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- Scryfall ---- */
function parse(t){
  const out=[];let cm=false;
  for(const l of t.split('\n')){
    const w=l.trim();
    if(/^(sideboard|maybeboard)/i.test(w))break;
    if(/^commanders?:?$/i.test(w)){cm=true;continue}
    if(!w||/^(deck|mainboard|main|companion):?$/i.test(w)){cm=false;continue}
    const m=l.trim().match(/^(\d+)x?\s+(.+?)(?:\s+\([A-Za-z0-9]+\).*)?$/);
    if(m)out.push([+m[1],m[2].replace(/\s+\/{1,2}\s+/g,' // ').trim(),cm]);
  }
  return out;
}
async function loadDeck(text){
  const rows=parse(text);
  if(!rows.length){$('#msg').textContent='No cards found. Use lines like "4 Lightning Bolt".';return false}
  const names=[...new Set(rows.map(r=>r[1]))], found={}, missing=[];
  let offline=false;
  for(let i=0;i<names.length;i+=75){
    $('#msg').textContent='Fetching cards from Scryfall… '+Math.min(i+75,names.length)+'/'+names.length;
    try{
      const r=await fetch('https://api.scryfall.com/cards/collection',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({identifiers:names.slice(i,i+75).map(name=>({name}))})});
      const j=await r.json();
      (j.data||[]).forEach(c=>found[c.name.split(' // ')[0].toLowerCase()]={name:c.name,img:imgOf(c),pt:ptOf(c),tokens:tokensOf(c),land:/\bLand\b/.test((c.type_line||(c.card_faces&&c.card_faces[0].type_line)||'').split(' // ')[0]),mana:c.produced_mana||[]});
      (j.not_found||[]).forEach(n=>missing.push(n.name));
    }catch(e){offline=true;break}
    await sleep(120);
  }
  if(offline)names.forEach(n=>{if(!found[n.split(' // ')[0].toLowerCase()])found[n.split(' // ')[0].toLowerCase()]={name:n,img:'',land:!!BASIC[n],mana:BASIC[n]?[BASIC[n]]:[]}});
  S.deck=[];
  lastMissing=[];
  rows.forEach(([n,name,cm])=>{const c=found[name.split(' // ')[0].toLowerCase()];if(c){for(let k=0;k<n;k++)S.deck.push(cm?{...c,cmd:true}:c)}else if(!lastMissing.includes(name))lastMissing.push(name)});
  $('#msg').textContent=S.deck.length+' of '+rows.reduce((a,r)=>a+r[0],0)+' cards loaded.'+(lastMissing.length?' Not found: '+lastMissing.join(', ')+'. Check the spelling, or remove the set code.':'');
  return S.deck.length>0;
}

/* ---- game state ---- */
function newGame(){
  const all=S.deck.map(c=>({id:++uid,name:c.name,img:c.img,pt:c.pt||'',tokens:c.tokens||[],cn:{},x:0,y:0,t:false,cmd:!!c.cmd,land:!!c.land,mana:c.mana||[]}));
  S.lib=all.filter(c=>!c.cmd);S.cmd=all.filter(c=>c.cmd);
  S.hand=[];S.bf=[];S.land=[];S.gy=[];S.ex=[];shuffle(S.lib);
  for(let i=0;i<7;i++)draw();
  render();
}
function draw(){const c=S.lib.pop();if(c)S.hand.push(c)}
function find(id){for(const z of ['hand','bf','land','gy','ex','cmd','lib']){const i=S[z].findIndex(c=>c.id===id);if(i>=0)return[z,i]}}
function move(id,to,x,y){
  const f=find(id);if(!f)return;
  const [c]=S[f[0]].splice(f[1],1);
  c.t=false;
  if(to!=='bf'&&to!=='land')c.cn={};
  if(c.token&&to!=='bf'&&to!=='land'){render();return}
  if(to==='bf'){c.x=x;c.y=y}
  S[to].push(c);render();
}

/* ---- render ---- */
function cardEl(c,cls){
  const d=document.createElement('div');
  d.className='card '+(cls||'')+(c.t?' t':'')+(c.token?' tok':'');d.dataset.id=c.id;
  if(c.img){const i=document.createElement('img');i.src=c.img;i.alt=c.name;i.draggable=false;d.append(i)}
  else{d.innerHTML='<div class="nm"></div>';d.firstChild.textContent=c.name}
  return d;
}
function render(){
  const bf=$('#bf');bf.querySelectorAll('.card,.pt,.more').forEach(e=>e.remove());
  S.bf.forEach(c=>{const e=cardEl(c);e.style.left=c.x+'px';e.style.top=c.y+'px';bf.append(e)});
  S.bf.forEach(c=>{
    const cs=Object.entries(c.cn||{});
    if(c.pt||cs.length){
      const p=document.createElement('div');p.className='pt';p.dataset.for=c.id;p.style.left=c.x+'px';p.style.top=(c.y+CH+2)+'px';
      if(c.pt){const sp=document.createElement('span'),v=curPT(c);sp.textContent=v;if(v!==c.pt)sp.style.color='#9be37a';p.append(sp)}
      cs.forEach(([n,v])=>{const i=document.createElement('i');i.textContent=n+' ×'+v;p.append(i)});
      bf.append(p);
    }
    const mb=document.createElement('button');mb.className='more';mb.dataset.for=c.id;mb.textContent='…';mb.title='Card menu';mb.style.left=(c.x+CW)+'px';mb.style.top=(c.y-34)+'px';mb.onclick=()=>{showMore(c.id);cardMenu(c,mb)};bf.append(mb);
  });
  bf.querySelector('.hint').style.display=S.bf.length?'none':'grid';
  syncMore();
  const LC=$('#lcards');LC.innerHTML='';
  {
    const n=S.land.length,LW=72,pad=12,step=n>1?Math.min(LW+8,Math.max(14,(LC.clientWidth-2*pad-LW-30)/(n-1))):0;
    S.land.forEach((c,i)=>{
      const x=pad+i*step,e=cardEl(c,'sm');e.style.left=x+'px';e.style.top='36px';LC.append(e);
      const mb=document.createElement('button');mb.className='more';mb.dataset.for=c.id;mb.textContent='…';mb.title='Card menu';mb.style.left=(x+LW)+'px';mb.style.top='2px';mb.onclick=()=>{showMore(c.id);cardMenu(c,mb)};LC.append(mb);
    });
    const tp=S.land.filter(c=>c.t),cnt={};let any=0;
    tp.forEach(c=>{const m=c.mana||[];if(m.length===1)cnt[m[0]]=(cnt[m[0]]||0)+1;else any++});
    $('#mana b').textContent=tp.length;
    const pp=$('#pips');pp.innerHTML='';
    ['W','U','B','R','G','C'].forEach(k=>{if(cnt[k]){const sp=document.createElement('span');sp.className='pip p'+k;sp.textContent=cnt[k];pp.append(sp)}});
    if(any){const sp=document.createElement('span');sp.className='pip pany';sp.title='Lands that can make several colors';sp.textContent=any;pp.append(sp)}
  }
  const h=$('#hand');h.innerHTML='';S.hand.forEach(c=>h.append(cardEl(c)));
  $('#zLib b').textContent=S.lib.length;$('#zGy b').textContent=S.gy.length;$('#zEx b').textContent=S.ex.length;$('#zCmd b').textContent=S.cmd.length;
  $('#life').textContent=S.life;
}

/* ---- pointer: tap, long-press zoom, drag ---- */
let drag=null,timer=null,lastTap={id:0,t:0};
function zoom(id){const f=find(id);if(!f)return;const c=S[f[0]][f[1]];if(!c.img)return;$('#zimg').src=c.img;$('#zoom').classList.add('on')}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.card[data-id]');if(!el)return;
  const id=+el.dataset.id,f=find(id);
  drag={el,id,zone:f&&f[0],sx:e.clientX,sy:e.clientY,moved:false,long:false};
  timer=setTimeout(()=>{if(drag&&!drag.moved){drag.long=true;zoom(id)}},450);
  el.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>8){
    drag.moved=true;clearTimeout(timer);
    drag.el.classList.add('drag');drag.el.style.width=CW+'px';drag.el.style.height=CH+'px';showPeek(drag.id,true);document.querySelectorAll('[data-for="'+drag.id+'"]').forEach(e=>e.style.display='none');
  }
  if(drag.moved){
    drag.el.style.left=(e.clientX-CW/2)+'px';drag.el.style.top=(e.clientY-CH/2)+'px';
    const z=zoneAt(e.clientX,e.clientY);
    document.querySelectorAll('.z').forEach(b=>b.classList.toggle('hl',b.dataset.zone===z));
    $('#lands').classList.toggle('hl',z==='land');
  }
});
function zoneAt(x,y){const t=document.elementsFromPoint(x,y).find(p=>p.dataset&&p.dataset.zone&&!p.classList.contains('card'));return t&&t.dataset.zone}
document.addEventListener('pointerup',e=>{
  if(!drag)return;clearTimeout(timer);
  const d=drag;drag=null;document.querySelectorAll('.z').forEach(b=>b.classList.remove('hl'));$('#lands').classList.remove('hl');
  if(d.moved){
    clearTimeout(pk);pk=setTimeout(hidePeek,3000);
    let z=zoneAt(e.clientX,e.clientY);
    if(!z){render();return}
    const fc=find(d.id),cd=fc&&S[fc[0]][fc[1]];
    if(cd){if(z==='bf'&&cd.land)z='land';else if(z==='land'&&!cd.land)z='bf'}
    if(z==='bf'){
      const r=$('#bf').getBoundingClientRect();
      move(d.id,'bf',Math.max(0,Math.min(r.width-CW,e.clientX-CW/2-r.left)),Math.max(34,Math.min(r.height-CH,e.clientY-CH/2-r.top)));
      showMore(d.id);
    }else{move(d.id,z);if(z==='land')showMore(d.id)}
  }else if(!d.long){
    const now=Date.now();
    const onField=d.zone==='bf'||d.zone==='land';
    if(onField)showMore(d.id);
    if(onField&&lastTap.id===d.id&&now-lastTap.t<350){const c=S[d.zone].find(c=>c.id===d.id);if(c){c.t=!c.t;render()}lastTap={id:0,t:0}}
    else{lastTap={id:d.id,t:now};showPeek(d.id)}
  }
});
document.addEventListener('pointercancel',()=>{drag=null;clearTimeout(timer);render()});
['gesturestart','gesturechange','gestureend','dblclick'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
let lastEnd=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastEnd<350&&e.target.closest('#bf,#lands,#hand'))e.preventDefault();lastEnd=n},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{if(!e.target.closest('.grid,textarea'))e.preventDefault()},{passive:false});

/* ---- buttons ---- */
$('#zoom').onclick=()=>$('#zoom').classList.remove('on');
$('#bImport').onclick=()=>$('#imp').classList.add('on');
$('#cancel').onclick=()=>$('#imp').classList.remove('on');
$('#go').onclick=async()=>{
  const b=$('#go');b.disabled=true;
  let txt=$('#list').value.trim();
  if(/^https?:\/\//i.test(txt)){
    $('#msg').textContent='Fetching deck from Moxfield…';
    const t=await moxText(txt);
    if(!t){$('#msg').textContent='Could not load that link (Moxfield can block browsers). On Moxfield tap Export, copy the text list, and paste it here.';b.disabled=false;return}
    txt=t;$('#list').value=t;
  }
  if(await loadDeck(txt)){if(!lastMissing.length)$('#imp').classList.remove('on');newGame()}b.disabled=false};
$('#restart').onclick=()=>{if(S.deck.length){newGame();$('#imp').classList.remove('on')}else $('#msg').textContent='Load a deck first.'};
$('#bDraw').onclick=()=>{draw();render()};
$('#zLib').onclick=()=>openZone('lib');
$('#bShuf').onclick=()=>{shuffle(S.lib);render()};
$('#bUntap').onclick=()=>{S.bf.forEach(c=>c.t=false);S.land.forEach(c=>c.t=false);render()};
$('#lm').onclick=()=>{S.life--;render()};
$('#lp').onclick=()=>{S.life++;render()};
let curZone=null;
function openZone(z){curZone=z;$('#zs').value='';fillZone();$('#zl').classList.add('on')}
function fillZone(){
  const z=curZone,q=$('#zs').value.trim().toLowerCase();
  let list=[...S[z]];
  list=z==='lib'?list.sort((a,b)=>a.name.localeCompare(b.name)):list.reverse();
  const shown=list.filter(c=>c.name.toLowerCase().includes(q));
  $('#zt').textContent=ZN[z]+' ('+(q?shown.length+' of ':'')+S[z].length+')';
  $('#zn').textContent=z==='lib'?'Sorted A to Z so the order stays secret. Tap a card to add it to your hand.':(z==='cmd'?'Tap a commander to put it on the table.':'Tap a card to return it to your hand.');
  $('#zsh').style.display=z==='lib'?'':'none';
  const g=$('#zg');g.innerHTML='';
  if(!shown.length){g.textContent='No cards found.'}
  shown.forEach(c=>{
    const d=document.createElement('div');
    if(c.img){d.style.padding=0;const i=document.createElement('img');i.src=c.img;i.alt=c.name;d.append(i)}else d.textContent=c.name;
    d.onclick=()=>{if(curZone==='cmd'){move(c.id,'bf',24+(S.bf.length%8)*28,48);$('#zl').classList.remove('on')}else{move(c.id,'hand');fillZone()}};
    g.append(d);
  });
}
$('#zs').addEventListener('input',fillZone);
$('#zsh').onclick=()=>{shuffle(S.lib);$('#zl').classList.remove('on');render()};
let pk=null;
function showPeek(id,hold){
  const f=find(id);if(!f)return;const c=S[f[0]][f[1]],p=$('#peek');
  p.innerHTML='';
  if(c.img){const i=document.createElement('img');i.src=c.img;i.alt=c.name;p.append(i)}
  else{const n=document.createElement('div');n.className='nm';n.textContent=c.name;p.append(n)}
  p.classList.add('on');clearTimeout(pk);if(!hold)pk=setTimeout(hidePeek,3000);
}
function hidePeek(){clearTimeout(pk);$('#peek').classList.remove('on')}
$('#peek').onclick=hidePeek;
function curPT(c){
  const m=(c.pt||'').match(/^(-?\d+)\/(-?\d+)$/);if(!m)return c.pt||'';
  const d=((c.cn&&c.cn['+1/+1'])||0)-((c.cn&&c.cn['-1/-1'])||0);
  return (+m[1]+d)+'/'+(+m[2]+d);
}
const CT=['+1/+1','-1/-1','Loyalty','Charge','Time','Shield'];
let cnCard=null;
function bump(c,n,d){c.cn=c.cn||{};c.cn[n]=Math.max(0,(c.cn[n]||0)+d);if(!c.cn[n])delete c.cn[n];render();fillCn()}
function mkb(t,f){const b=document.createElement('button');b.textContent=t;b.onclick=f;return b}
function openCn(c){cnCard=c;$('#cnt').textContent=c.name;$('#cni').value='';fillCn();$('#cn').classList.add('on')}
function fillCn(){
  const c=cnCard,box=$('#cnr');box.innerHTML='';
  [...new Set([...CT,...Object.keys(c.cn||{})])].forEach(n=>{
    const row=document.createElement('div');row.className='crow';
    const l=document.createElement('span');l.textContent=n;
    const v=document.createElement('b');v.textContent=(c.cn&&c.cn[n])||0;
    row.append(l,mkb('−',()=>bump(c,n,-1)),v,mkb('+',()=>bump(c,n,1)));
    box.append(row);
  });
}
$('#cna').onclick=()=>{const n=$('#cni').value.trim();if(n&&cnCard){bump(cnCard,n,1);$('#cni').value=''}};
$('#cnd').onclick=()=>$('#cn').classList.remove('on');
const tm=document.createElement('div');tm.id='tokmenu';document.body.append(tm);
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#tokmenu,.more'))tm.style.display='none'});
let shownId=0,mt=null;
function syncMore(){document.querySelectorAll('.more').forEach(b=>b.classList.toggle('on',+b.dataset.for===shownId))}
function showMore(id){shownId=id;clearTimeout(mt);mt=setTimeout(()=>{shownId=0;syncMore()},2000);syncMore()}
function place(btn){const r=btn.getBoundingClientRect();tm.style.display='flex';tm.style.left=Math.max(8,Math.min(r.right-180,innerWidth-200))+'px';tm.style.top=(r.bottom+4)+'px'}
function cardMenu(c,btn){
  tm.innerHTML='';
  const add=(t,f,cls)=>{const b=mkb(t,()=>{tm.style.display='none';f()});if(cls)b.className=cls;tm.append(b)};
  add('Duplicate',()=>dup(c));
  if(c.tokens&&c.tokens.length)add('Add Token',()=>{
    if(c.tokens.length===1)return summon(c,c.tokens[0]);
    tm.innerHTML='';c.tokens.forEach(t=>tm.append(mkb(t.name,()=>{tm.style.display='none';summon(c,t)})));place(btn);
  });
  add('Add Counter',()=>openCn(c));
  add('Destroy',()=>move(c.id,'gy'),'del');
  add('Exile',()=>move(c.id,'ex'));
  place(btn);
}
function dup(c){
  const f=find(c.id),r=$('#bf').getBoundingClientRect();
  if(f&&f[0]==='land'){S.land.push({...c,id:++uid,cn:{...(c.cn||{})},token:true,t:false});render();return}
  S.bf.push({...c,id:++uid,cn:{...(c.cn||{})},token:true,x:Math.max(0,Math.min(r.width-CW,c.x+24)),y:Math.max(34,Math.min(r.height-CH,c.y+24))});
  render();
}
async function summon(c,t){
  let d={name:t.name,img:'',pt:''};
  try{const r=await fetch('https://api.scryfall.com/cards/'+t.id);const j=await r.json();if(j.name)d={name:j.name,img:imgOf(j),pt:ptOf(j)}}catch(e){}
  const r=$('#bf').getBoundingClientRect();
  let x=c.x+CW+8;if(x>r.width-CW)x=c.x-CW-8;
  S.bf.push({id:++uid,name:d.name,img:d.img,pt:d.pt,tokens:[],cn:{},token:true,x:Math.max(0,x),y:Math.max(34,Math.min(r.height-CH,c.y)),t:false});
  render();
}
async function moxText(url){
  const m=url.match(/moxfield\.com\/decks\/([A-Za-z0-9_-]+)/);if(!m)return null;
  for(const api of ['https://api2.moxfield.com/v3/decks/all/','https://api2.moxfield.com/v2/decks/all/']){
    try{
      const r=await fetch(api+m[1]);if(!r.ok)continue;
      const j=await r.json(),b=j.boards||{};
      const pick=k=>Object.values((b[k]&&b[k].cards)||j[k]||{});
      const fmt=a=>a.map(e=>e.quantity+' '+e.card.name);
      const cm=fmt(pick('commanders')),mb=fmt(pick('mainboard'));
      if(cm.length+mb.length)return (cm.length?'Commander\n'+cm.join('\n')+'\n\nDeck\n':'')+mb.join('\n');
    }catch(e){}
  }
  return null;
}
$('#zGy').addEventListener('click',()=>openZone('gy'));
$('#zEx').addEventListener('click',()=>openZone('ex'));
$('#zCmd').addEventListener('click',()=>openZone('cmd'));
$('#zc').onclick=()=>$('#zl').classList.remove('on');
addEventListener('resize',render);
render();
</script>
